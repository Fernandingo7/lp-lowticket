<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado! — Playbook do Reclamante</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800;900&display=swap">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #2d1408;
    --bg-mid:    #3d1d0e;
    --red:       #920000;
    --red-bright:#b00000;
    --green:     #39d353;
    --copper:    #c9895e;
    --white:     #ffffff;
    --text-muted: rgba(255,255,255,0.80);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Raleway', sans-serif;
    background: var(--bg);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ── TOP BANNER ── */
  .top-banner {
    background: linear-gradient(90deg, var(--red) 0%, var(--red-bright) 100%);
    padding: 18px 20px;
    text-align: center;
  }

  .top-banner p {
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--white);
    line-height: 1.2;
  }

  /* ── MAIN ── */
  .main {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 72px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }

  /* ── HEADLINE ── */
  .headline {
    font-size: clamp(26px, 6vw, 40px);
    font-weight: 900;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.12;
    letter-spacing: 0.01em;
    color: var(--white);
  }

  .headline .hl {
    color: var(--copper);
  }

  /* ── VIDEO ── */
  .video-wrap {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border: 1px solid rgba(201,137,94,0.25);
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* ── BODY COPY ── */
  .body-copy {
    font-size: clamp(16px, 3.5vw, 19px);
    font-weight: 600;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.6;
    max-width: 520px;
  }

  /* ── CTA BUTTON ── */
  .cta-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 520px;
    background: var(--green);
    color: #000;
    font-family: 'Raleway', sans-serif;
    font-weight: 800;
    font-size: clamp(16px, 3.8vw, 20px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 8px;
    padding: 20px 32px;
    text-align: center;
    cursor: pointer;
    border: none;
    position: relative;
    overflow: hidden;
    transition: filter 0.2s, transform 0.15s, box-shadow 0.3s;
    animation: btn-pulse 2s ease-in-out infinite;
  }

  .cta-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 30%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: shimmer 4s infinite;
  }

  .cta-btn:hover {
    filter: brightness(1.12);
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 10px 32px rgba(57,211,83,0.35);
  }

  @keyframes btn-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(57,211,83,0.4); }
    50%       { box-shadow: 0 0 22px 6px rgba(57,211,83,0.18); }
  }

  @keyframes shimmer {
    0%   { left: -100%; }
    100% { left: 200%; }
  }

  /* ── DIVIDER ── */
  .divider {
    width: 60px;
    height: 3px;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--copper), #f1c257, var(--copper));
  }
</style>
</head>
<body>

  <!-- TOP BANNER -->
  <div class="top-banner">
    <p>Falta apenas 1 passo!</p>
  </div>

  <!-- MAIN CONTENT -->
  <main class="main">

    <h1 class="headline">
      Assista o vídeo abaixo e retire<br>
      <span class="hl">1 presente especial</span> agora!
    </h1>

    <div class="divider"></div>

    <!-- VIDEO — substitua o src pelo link do seu vídeo -->
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID_AQUI?rel=0&modestbranding=1"
        title="Vídeo especial"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <p class="body-copy">
      Após assistir o vídeo, toque no botão abaixo para acessar o grupo e ter acesso ao curso gratuito:
    </p>

    <!-- CTA BUTTON — substitua o href pelo link do grupo -->
    <a href="LINK_DO_GRUPO_AQUI" class="cta-btn">
      Entrar no grupo agora!
    </a>

  </main>

</body>
</html>
